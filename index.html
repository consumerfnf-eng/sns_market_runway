<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#ffffff; --card:#f4f4f2; --card2:#ffffff; --ink:#111111; --mute:#6f6f6f; --line:#e6e6e3; --chip:#e9e9e6;
  --orange:#DD2A7B; --orange-soft:#fbe3ee; --ig:linear-gradient(135deg,#515BD4,#8134AF 30%,#DD2A7B 55%,#F58529 80%,#FEDA77); --bar:#9fb9bd; --bar-soft:#e4ecee; --green:#2c7a4b;
  --r:14px; --fs:13px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 -apple-system,"Pretendard","Noto Sans KR","Inter",Segoe UI,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px}
button:disabled{opacity:.4;cursor:default}
input[type=text],select{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
input:focus,select:focus{outline:2px solid #ddd;outline-offset:0}
header{display:flex;align-items:center;gap:22px;padding:14px 26px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
header .logo{font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;flex-direction:column;line-height:1.15}header .logo small{font-weight:500;color:var(--mute);font-size:10px;letter-spacing:0}
header .srcnav{display:flex;gap:18px;margin:0 auto}
header .srcnav button{border:none;background:none;border-radius:0;padding:4px 0;color:var(--mute);font-weight:600;border-bottom:2px solid transparent}
header .srcnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
header .right{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px}
header .admin{background:var(--ink);color:#fff;border-color:var(--ink);font-size:12px}
.subbar{display:flex;align-items:center;gap:14px;padding:12px 26px 0 26px}
.subbar .tabs{display:flex;gap:18px}
.subbar .tabs button{border:none;background:none;border-radius:0;padding:4px 0;color:var(--mute);font-weight:600;border-bottom:2px solid transparent}
.subbar .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.subbar .tabs button sup{font-size:9px;background:var(--chip);border-radius:4px;padding:0 4px;margin-left:3px;color:var(--mute)}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.pchip select{border:none;background:none;padding:0;font-weight:600}
.clear{border:none;background:none;color:var(--mute);font-size:12px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:16px 26px 80px}
.layout.noaside{grid-template-columns:1fr}.layout.noaside aside{display:none}
aside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-right:8px;border-right:1px solid var(--line)}
aside .tog{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:12px;padding:6px 8px;margin-bottom:10px}
.switch{width:30px;height:16px;border-radius:999px;background:#ccc;position:relative;cursor:pointer;transition:.15s}
.switch i{position:absolute;top:2px;left:2px;width:12px;height:12px;background:#fff;border-radius:50%;transition:.15s}
.switch.on{background:var(--ink)}.switch.on i{left:16px}
aside .t{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 2px}
aside .it{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:12px}
aside .it:hover{background:var(--card)}aside .it.on{background:var(--ink);color:#fff}
aside .it b{font-weight:500;opacity:.55;font-size:11px}
aside .search{width:100%;margin:4px 0 8px;font-size:12px}
.view{display:none}.view.on{display:block}
/* ---- coverage ---- */
.cov-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cov-bar input{width:280px}
.cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px 14px}
.cov{cursor:pointer}
.cov img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#eee;display:block}
.cov .cap{font-size:11px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov .cap b{color:var(--ink);font-weight:600}
.cov .cap i{font-style:normal;margin:0 4px;opacity:.5}
.more{text-align:center;margin:20px}
/* 셀럽 착장: 실버 반짝이 테두리 */
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.celeb{position:relative}
.celeb::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;background:var(--ig);background-size:100% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.star{display:none;position:absolute;top:6px;right:6px;font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));z-index:4;pointer-events:none}
@keyframes blinkonce{0%{opacity:0;transform:scale(.8)}40%{opacity:1;transform:scale(1.12)}70%{opacity:.35}100%{opacity:1;transform:scale(1)}}
.celeb-tag{animation:blinkonce 1.4s ease-out 1;position:absolute;left:8px;bottom:8px;background:var(--ig);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;z-index:4;letter-spacing:.03em}
.card .imgs .ph{position:relative;border-radius:6px}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:11px}
.card .tags .hash{color:var(--orange);font-weight:600}
.card .tags .red{color:#1f5fd1;font-weight:700}
.dt-imgs .ph{position:relative;border-radius:8px}
.kpi.big div{padding:10px 16px;background:#fff;border:1px solid var(--line)}
.kpi.big div b{font-size:22px}
.kpi.big div.red{border-color:#1f5fd1;color:#1f5fd1}
/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;cursor:pointer;position:relative}
.card .foot{display:flex;align-items:center;gap:5px;margin-top:10px;min-height:26px;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;line-height:1.2}
.pill.cel{background:var(--ig);color:#fff}
.pill.rank{background:#1f5fd1;color:#fff}
.pill.dat{background:#fff;color:#1f5fd1;border:1px solid #1f5fd1}
.pill.mut{color:var(--mute);font-weight:500;background:none;padding-left:0}
.card .foot .pl{display:flex;gap:5px;flex:1;min-width:0;overflow:hidden}.card .foot .pick{margin-left:auto;flex-shrink:0;white-space:nowrap}
.card .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;background:var(--chip);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.key{background:#eaf2e6}.chip.key2{background:#e2ecef}
.card h3{margin:0 0 3px;font-size:15px;display:flex;align-items:baseline;gap:8px}.card h3 small{font-size:11px;color:var(--mute);font-weight:500;margin-left:auto}
.card .desc{font-size:12px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px}
.card .imgs{display:flex;gap:5px;margin:8px 0 0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding-bottom:4px}
.card .imgs .ph{flex:0 0 calc((100% - 10px)/3);scroll-snap-align:start}
.card .imgs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#e6e6e3;display:block}
.card .more{background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 6px;border-radius:999px}
.boxes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bx{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;min-width:90px}
.bx small{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.bx b{font-size:13px}
.bx.celeb-bx{border-color:#bdbdbd;background:linear-gradient(135deg,#fafafa,#ececec)}
.bx.data-bx{border-color:#1f5fd1;color:#1f5fd1}
.bx{position:relative}.bx .pop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.bx .pop img{max-width:360px;max-height:420px;display:block;border-radius:6px}.bx.has-img:hover .pop{display:block}
.bx.rank-bx{background:#1f5fd1;color:#fff;border-color:#1f5fd1}.bx.rank-bx small{color:rgba(255,255,255,.8)}.bx.rank-bx b{font-size:16px}
.bx.empty-bx{color:var(--mute);border-style:dashed}
.card .hashes{display:flex;gap:6px;flex-wrap:wrap;margin:0;font-size:12px}
.card .hashes span{color:var(--orange);font-weight:600}
.dt-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.dt-strip .ph{flex:0 0 220px;position:relative;border-radius:8px}
.dt-strip img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#eee;cursor:zoom-in;display:block}
.plabel{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:4;pointer-events:none}.plabel span{background:rgba(20,20,20,.55);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;backdrop-filter:blur(3px);white-space:nowrap}
.dt-strip .dl{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:5}.dt-strip .dl:hover{background:var(--ink);color:#fff}
.card .stats{display:flex;gap:14px;font-size:11px;color:var(--mute);align-items:center}
.card .stats svg{width:12px;height:12px;vertical-align:-2px;margin-right:3px;opacity:.7}
.card .pickrow{display:flex;justify-content:flex-end;margin-top:12px;min-height:28px}
.pick{background:var(--ig);color:#fff;border:none;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pick svg{width:11px;height:11px}
/* ---- analytics ---- */
.an-wrap{max-width:1200px}
.an-head{display:flex;align-items:baseline;gap:12px;margin:8px 0 14px}
.an-head h2{font-size:22px;margin:0}
.an-head .mute{font-size:12px}
.an-sec{margin-bottom:28px}
.an-sec h2{font-size:17px;margin:0 0 4px}
.an-sec .sub{font-size:12px;color:var(--mute);margin-bottom:12px}
.fambar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-bottom:14px}
.fambar div{display:flex;flex-direction:column;justify-content:center;padding:0 10px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;text-shadow:0 0 2px rgba(0,0,0,.25)}
.fambar div span{font-weight:500;font-size:10px}
.fambar div.dim{opacity:.45}
.an-grid{display:grid;grid-template-columns:1fr 300px;gap:14px}
.panel{background:var(--card);border-radius:16px;padding:16px}
.panel h3{margin:0 0 8px;font-size:14px}
.panel .note{font-size:11px;color:var(--mute);margin-top:8px}
.shade{display:grid;grid-template-columns:110px 1fr 60px 44px;gap:6px;align-items:center;font-size:12px;margin:5px 0}
.shade .nm{display:flex;align-items:center;gap:6px}.shade .nm i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.shade .bar{height:16px;background:#fff;border-radius:4px;overflow:hidden}.shade .bar i{display:block;height:100%;background:var(--bar)}
.shade .n{text-align:right;color:var(--mute);font-size:11px}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.cat-tabs button{border:none;background:var(--card);font-size:12px;padding:5px 11px}
.cat-tabs button.on{background:#f4f06a;font-weight:700}
.top10{display:grid;grid-template-columns:120px 1fr 1fr;gap:16px;align-items:start}
.top10 img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#e6e6e3}
.top10 .col .row{display:grid;grid-template-columns:18px 1fr 80px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.top10 .col .row .b{background:#fff;border-radius:4px;height:18px;position:relative;overflow:hidden}
.top10 .col .row .b i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.top10 .col .row .b span{position:relative;padding-left:6px;line-height:18px;font-weight:600}
.top10 .col .row .n{text-align:right;color:var(--mute);font-size:11px}
.trend{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.trend .nm{display:flex;align-items:center;gap:8px}.trend .nm i{width:12px;height:12px;border-radius:50%;display:inline-block}
.trend b{font-size:11px;color:var(--green)}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
.modal.on{display:flex}
.box{background:#fff;border-radius:18px;width:min(1000px,100%);padding:24px;position:relative}
.box .close{position:absolute;top:14px;right:14px}
.dt-head .chips{display:flex;gap:6px;margin-bottom:10px}
.dt-head h2{margin:0 0 4px;font-size:22px}
.dt-head .meta{font-size:12px;color:var(--mute)}
.dt-stats{display:flex;gap:18px;font-size:12px;color:var(--mute);margin:10px 0 16px}
.dt-stats svg{width:12px;height:12px;vertical-align:-2px;margin-right:3px;opacity:.7}
.dt-sec{margin:16px 0}
.dt-sec h4{margin:0 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.dt-imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dt-imgs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#eee;cursor:zoom-in}
.dt-imgs.three{grid-template-columns:repeat(3,220px)}
.ev{display:grid;grid-template-columns:80px 1fr 1fr 1fr;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.ev .tp{font-weight:700}
.sw{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;background:#fff;margin:0 6px 6px 0}
.sw i{width:20px;height:20px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.sw small{color:var(--mute)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{background:var(--card);border-radius:10px;padding:8px 12px;font-size:12px}
.kpi div b{display:block;font-size:16px}
.lb{display:grid;grid-template-columns:1fr 320px;gap:16px}
.lb img{width:100%;border-radius:10px;background:#eee}
.empty{color:var(--mute);padding:40px;text-align:center}
.toast{position:fixed;top:70px;right:20px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;z-index:60;display:none}
.toast.on{display:block}.toast.err{background:var(--orange)}
</style>
</head>
<body>
<header>
  <div class="logo">Fashion Analysis<small>소비자분석팀</small></div>
  <nav class="srcnav" id="srcnav">
    <button data-s="runway">Runway</button>
    <button data-s="instagram" class="on">Instagram</button>
    <button data-s="market">Market</button>
    <button data-s="ai">AI Analytics</button>
  </nav>
  <div class="right"><span id="ver">v261023-04</span><a class="admin" href="admin.html"><button class="admin">+ 수집 / 관리</button></a></div>
</header>

<div class="subbar">
  <div class="tabs" id="tabs">
    <button data-t="coverage">Coverage</button>
    <button data-t="analytics">Analytics</button>
    <button data-t="trends" class="on">Emerging Trends</button>
    <button data-t="report" id="tabReport" style="display:none">Season Report</button>
  </div>
  <span class="pchip" id="pchip"><select id="pFrom"></select><span style="opacity:.5">~</span><select id="pTo"></select></span>
  <button class="clear" id="clear">Clear Filter</button>
  <span style="flex:1"></span>
  <button id="btnExport" title="현재 소스·기간·카테고리 기준으로 카드 + AI Analytics를 단일 HTML 리포트로 저장">⤓ 리포트 다운로드</button>
</div>

<div class="layout">
  <aside id="aside"></aside>
  <main>
    <!-- Coverage -->
    <section class="view" id="v-coverage">
      <div class="cov-bar"><input type="text" id="covSearch" placeholder="Search across images…"><span class="mute" id="covN" style="font-size:12px;color:var(--mute)"></span></div>
      <div class="cov-grid" id="covGrid"></div>
      <div class="more"><button id="covMore">더 보기</button></div>
    </section>
    <!-- Emerging Trends -->
    <section class="view on" id="v-trends">
      <div class="cards" id="cards"></div>
    </section>
    <!-- Season Report (Runway) -->
    <section class="view" id="v-report">
      <div class="gbar" style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><div class="cat-tabs" id="rpSeasons" style="margin:0"></div><span style="flex:1"></span><a id="rpOpen" href="#" target="_blank" style="font-size:12px;color:var(--mute);text-decoration:underline">새 창에서 열기 ↗</a></div>
      <iframe id="rpFrame" style="width:100%;height:calc(100vh - 170px);border:1px solid var(--line);border-radius:14px;background:#fff" title="Season Report"></iframe>
      <div class="empty" id="rpEmpty" style="display:none">등록된 시즌 리포트가 없습니다 — admin 설정 탭 "런웨이 시즌 리포트"에 추가하세요</div>
    </section>
    <!-- Analytics -->
    <section class="view" id="v-analytics">
      <div class="an-wrap" id="an"></div>
    </section>
  </main>
</div>

<!-- card detail -->
<div class="modal" id="mDetail"><div class="box"><button class="close" data-close="mDetail">✕</button><div id="detail"></div></div></div>
<!-- lightbox -->
<div class="modal" id="mLb"><div class="box"><button class="close" data-close="mLb">✕</button><div class="lb"><div><img id="lbImg" alt=""></div><div id="lbInfo"></div></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   TAXONOMY AGENT · index.html (리포트)  v261023-04
   Coverage(갤러리) · Emerging Trends(3열 카드) · Analytics(컬러 바 + Top10)
   소스: Runway / Instagram / Market / FS Benchmark(엑셀 수치)
   ===================================================================== */
const SUPA_URL = 'https://bfptdiketvahjvwefwmj.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcHRkaWtldHZhaGp2d2Vmd21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MzAyMTEsImV4cCI6MjEwODIwNjIxMX0.shywn_QE1lRrK8E2DbAQy1-HMk8gx_SKe4hzYNT646E';
const BUCKET = 'tx-images';
const PAGE = 60;
const FAM_HEX = { Neutrals: '#1b1b1b', Blue: '#2f7fc1', Pink: '#f08fb4', Green: '#4fa05a', Red: '#d8322b', Yellow: '#f2d23a', Orange: '#f08a2c', Purple: '#8c56b8' };
const FACET_LABEL = { product: 'Key Items', fnf: 'Key Items', pattern: 'Pattern & Graphics', color: 'Color', material: 'Materials', detail: 'Details', theme: 'Themes' };

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pubUrl = p => `${SUPA_URL}/storage/v1/object/public/${BUCKET}/${p}`;
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 3000); };

  } else h += '<div class="empty">컬러 데이터 없음 — 분석된 사진이 필요합니다</div>';
  h += `</div>`;
  // ---- Category statistics
  const tabs = [{ id: 'pattern', label: 'Pattern & Graphics' }, { id: 'material', label: 'Materials' }, { id: 'detail', label: 'Details' }];
  const cats = TAX.nodes.filter(n => n.kind === 'category' && n.facet === 'product' && n.parent_id === 'product.apparel');
  for (const c of cats) { const has = src === 'fs' ? (cnt[c.id] || 0) > 0 : (totals[c.id] || 0) > 0; if (has) tabs.push({ id: c.id, label: c.name_en }); }
  S.cat = tabs.some(t => t.id === S.cat) ? S.cat : tabs[0].id;
  h += `<div class="an-sec"><h2>Category Statistics</h2><div class="sub">Top ten per category.</div><div class="cat-tabs">${tabs.map(t => `<button data-cat="${t.id}" class="${S.cat === t.id ? 'on' : ''}">${esc(t.label)}</button>`).join('')}</div>`;
  // rows for current tab
  let items = [], base = 0, title = ''; let subTabs = '';
  if (['pattern', 'material', 'detail'].includes(S.cat)) {
    title = tabs.find(t => t.id === S.cat).label;
    // 카테고리 선택 줄 (전체 / 데이터 있는 카테고리) — 패턴·소재·디테일이 어떤 아이템에서 나왔는지
    const fcats = []; if (byFocus) { const cc = {}; for (const [k, v] of Object.entries(byFocus)) { const [nid, f] = k.split('|'); const n = TAX.byId[nid]; if (n && n.facet === S.cat && f) cc[f] = (cc[f] || 0) + v; } for (const [f, v] of Object.entries(cc)) fcats.push({ id: f, n: v }); fcats.sort((a, b) => ((TAX.byId[a.id] || {}).sort_order ?? 1e9) - ((TAX.byId[b.id] || {}).sort_order ?? 1e9)); }
    S.facetCat = fcats.some(c => c.id === S.facetCat) ? S.facetCat : '';
    if (fcats.length) subTabs = `<div class="cat-tabs" style="margin:-4px 0 12px"><span class="note" style="margin:0 6px 0 0;align-self:center">카테고리별</span><button data-fcat="" class="${S.facetCat ? '' : 'on'}">전체</button>${fcats.map(c => `<button data-fcat="${c.id}" class="${S.facetCat === c.id ? 'on' : ''}">${esc(nodeName(c.id))} <span style="opacity:.6">${c.n}</span></button>`).join('')}</div>`;
    const fcnt = {}; if (S.facetCat && byFocus) { for (const [k, v] of Object.entries(byFocus)) { const [nid, f] = k.split('|'); if (f === S.facetCat) fcnt[nid] = (fcnt[nid] || 0) + v; } } else Object.assign(fcnt, cnt);
    items = TAX.nodes.filter(n => n.facet === S.cat && (n.kind === 'value' || (S.cat === 'pattern' && n.kind === 'sub')) && !n.canonical_id && fcnt[n.id]).map(n => ({ n, v: fcnt[n.id] }));
    base = src === 'fs' ? items.reduce((s, x) => s + x.v, 0) : (S.facetCat ? (totals[S.facetCat] || 0) : denom);
    if (S.facetCat) title += ' · ' + nodeName(S.facetCat);
  } else {
    const cat = TAX.byId[S.cat]; title = cat.name_en;
    if (src === 'fs') { for (const ax of (TAX.children[cat.id] || [])) for (const v of (TAX.children[ax.id] || [])) if (cnt[v.id]) items.push({ n: v, v: cnt[v.id], ax: ax.name_en }); base = cnt[cat.id] || 0; }
    else {
      let q = sb.from('tx_v_tag_counts').select('node_id,photos').eq('source', src).eq('focus_node_id', cat.id); q = withPeriod(q);
      const { data } = await q.limit(5000); const agg = {}; for (const r of (data || [])) agg[r.node_id] = (agg[r.node_id] || 0) + r.photos;
      for (const [id, v] of Object.entries(agg)) { const n = TAX.byId[id]; if (!n || n.kind === 'category' || n.facet === 'color') continue; items.push({ n, v }); }
      base = totals[cat.id] || 0;
    }
  }
  { const byName = {}; for (const x of items) { const k = x.n.name_en.toLowerCase(); if (!byName[k] || byName[k].v < x.v) byName[k] = x; } items = Object.values(byName); }   // 같은 이름 중복 제거 (Pleated: Style + Details)
  items.sort((a, b) => b.v - a.v); const top10 = items.slice(0, 10); const mx = top10[0]?.v || 1;
  const rowHTML = (x, i) => `<div class="row"><span style="color:var(--mute);font-size:11px">${i + 1}</span><div class="b"><i style="width:${x.v / mx * 100}%"></i><span>${esc(x.n.name_en)}</span></div><div class="n">${fmt(x.v)} (${pct(x.v, base)}%)</div></div>`;
  let thumb = '';
  if (src !== 'fs' && top10[0]) { const { data } = await sb.from('tx_media_tags').select('media_id').eq('node_id', top10[0].n.id).limit(1); if (data && data[0]) { const { data: m } = await sb.from('tx_media').select('thumb_path').eq('id', data[0].media_id).single(); if (m) thumb = `<img src="${pubUrl(m.thumb_path)}" alt="">`; } }
  h += subTabs + `<div class="panel"><h3>${esc(title)}</h3>${top10.length ? `<div class="top10"><div>${thumb || '<div style="aspect-ratio:3/4;background:#e6e6e3;border-radius:8px"></div>'}</div><div class="col">${top10.slice(0, 5).map(rowHTML).join('')}</div><div class="col">${top10.slice(5, 10).map((x, i) => rowHTML(x, i + 5)).join('')}</div></div><div class="note">Percentages represent each style's share of all ${esc(title)} items${src === 'fs' ? ' (FS 집계, 복수 태그라 합계 100% 초과 가능)' : ''}.</div>` : '<div class="empty">데이터 없음</div>'}</div></div>`;
  an.innerHTML = h;
  an.querySelectorAll('.fambar div').forEach(d => d.onclick = () => { S.fam = d.dataset.fam; renderAnalytics(); });
  an.querySelectorAll('.cat-tabs button[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderAnalytics(); });
  an.querySelectorAll('[data-fcat]').forEach(b => b.onclick = () => { S.facetCat = b.dataset.fcat; renderAnalytics(); });
  an.querySelectorAll('[data-ansrc]').forEach(b => b.onclick = async () => { S.anSrc = b.dataset.ansrc; await loadPeriods(); renderAnalytics(); });
  an.querySelectorAll('[data-ccat]').forEach(b => b.onclick = () => { S.colorCat = b.dataset.ccat; S.fam = null; renderAnalytics(); });
}

boot();
</script>
</body>
</html>
